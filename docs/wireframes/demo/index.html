<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osteosome 界面 Demo</title>
<style>
/* ===== 设计令牌（与客户端 tokens.css 同源）===== */
:root {
  color-scheme: light;
  --color-bg: #f5f6f8;
  --color-surface: #ffffff;
  --color-surface-2: #eef0f4;
  --color-surface-3: #e3e7ed;
  --color-border: #d5dae1;
  --color-border-strong: #b6bec9;
  --color-text: #1b2027;
  --color-text-muted: #5c6673;
  --color-text-inverse: #ffffff;
  --color-primary: #2f6feb;
  --color-primary-hover: #2559c4;
  --color-primary-active: #1f4ba5;
  --color-primary-soft: #e7effd;
  --color-danger: #cf222e;
  --color-danger-soft: #fdecee;
  --color-success: #1a7f37;
  --color-warning: #9a6700;
  --color-focus-ring: #2f6feb;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px;
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 10px; --radius-full: 999px;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  --text-xs: 12px; --text-sm: 13px; --text-md: 14px; --text-lg: 16px; --text-xl: 20px;
  --shadow-sm: 0 1px 2px rgba(16,22,26,.08);
  --shadow-md: 0 4px 12px rgba(16,22,26,.12);
  --shadow-lg: 0 12px 32px rgba(16,22,26,.18);
  --duration-fast: 120ms; --duration-base: 200ms;
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --color-bg: #14171c;
  --color-surface: #1c2027;
  --color-surface-2: #232832;
  --color-surface-3: #2b313c;
  --color-border: #333a45;
  --color-border-strong: #454e5c;
  --color-text: #e6e9ee;
  --color-text-muted: #9aa4b2;
  --color-text-inverse: #14171c;
  --color-primary: #4f8cff;
  --color-primary-hover: #6b9fff;
  --color-primary-active: #3a72e0;
  --color-primary-soft: #1d2b45;
  --color-danger: #f85149;
  --color-danger-soft: #3a1d20;
  --color-success: #3fb950;
  --color-warning: #d29922;
  --color-focus-ring: #4f8cff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 4px 12px rgba(0,0,0,.5);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); font-size: var(--text-md); color: var(--color-text); background: var(--color-bg); -webkit-font-smoothing: antialiased; }

/* ===== 演示导航壳 ===== */
.demo-shell { display: flex; height: 100vh; }
.demo-nav { width: 232px; flex-shrink: 0; background: var(--color-surface); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; overflow-y: auto; }
.demo-nav__brand { padding: var(--space-4); font-weight: 700; font-size: var(--text-lg); display: flex; align-items: center; gap: var(--space-2); border-bottom: 1px solid var(--color-border); }
.demo-nav__theme { margin-left: auto; font-size: var(--text-xs); color: var(--color-text-muted); cursor: pointer; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 2px 6px; }
.demo-nav__section { padding: var(--space-2) var(--space-4); font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 600; letter-spacing: .05em; margin-top: var(--space-2); }
.demo-nav__item { padding: var(--space-2) var(--space-4); cursor: pointer; font-size: var(--text-sm); display: flex; align-items: center; gap: var(--space-2); border: 0; background: none; color: var(--color-text); text-align: left; width: 100%; }
.demo-nav__item:hover { background: var(--color-surface-2); }
.demo-nav__item.active { background: var(--color-primary-soft); color: var(--color-primary); font-weight: 600; }
.demo-stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.demo-stage__toolbar { height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); background: var(--color-surface); border-bottom: 1px solid var(--color-border); font-size: var(--text-xs); color: var(--color-text-muted); }
.demo-stage__frame { flex: 1; min-height: 0; position: relative; overflow: auto; padding: var(--space-5); display: flex; align-items: center; justify-content: center; }

/* ===== 通用组件 ===== */
.btn { font-family: inherit; font-size: var(--text-sm); padding: 6px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background var(--duration-fast), border-color var(--duration-fast), box-shadow var(--duration-fast); }
.btn:hover { background: var(--color-surface-2); }
.btn:active { transform: translateY(0); }
.btn:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
.btn--primary { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-text-inverse); }
.btn--primary:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }
.btn--danger { background: var(--color-surface); border-color: var(--color-danger); color: var(--color-danger); }
.btn--danger:hover { background: var(--color-danger-soft); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--color-text-muted); }
.btn--ghost:hover { background: var(--color-surface-2); color: var(--color-text); }
.btn--sm { padding: 4px 8px; font-size: var(--text-xs); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: var(--color-text-muted); border-radius: var(--radius-md); cursor: pointer; font-size: var(--text-sm); }
.icon-btn:hover { background: var(--color-surface-2); color: var(--color-text); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-xs); padding: 1px 8px; border-radius: var(--radius-full); background: var(--color-surface-2); color: var(--color-text-muted); }
.badge--dot { width: 7px; height: 7px; border-radius: 50%; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.green { background: var(--color-success); }
.dot.yellow { background: var(--color-warning); }
.dot.red { background: var(--color-danger); }
.dot.gray { background: var(--color-border-strong); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); padding: 3px 10px; border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted); cursor: grab; }

/* ===== TopBar ===== */
.topbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); background: var(--color-surface); border-bottom: 1px solid var(--color-border); box-shadow: var(--shadow-sm); }
.topbar__brand { font-weight: 700; margin-right: var(--space-2); }
.topbar__spacer { flex: 1; }
.topbar__mode { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); padding: 5px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface); cursor: pointer; }
.topbar__mode:hover { background: var(--color-surface-2); }

/* ===== 面板 (dockview 风格) ===== */
.workspace { flex: 1; min-height: 0; display: flex; gap: var(--space-2); padding: var(--space-2); }
.panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-sm); position: relative; }
.panel--runtime .panel__header { display: none; }
.panel__header { flex-shrink: 0; height: 32px; display: flex; align-items: center; padding: 0 var(--space-3); background: var(--color-surface-2); border-bottom: 1px solid var(--color-border); font-size: var(--text-sm); font-weight: 600; }
.panel__header-actions { margin-left: auto; display: flex; gap: 2px; }
/* 顶部栏：默认隐藏，鼠标悬停到 panel 顶部时浮现 */
.panel--hoverbar { padding-top: 0; }
.panel--hoverbar .panel__hoverbar {
  position: absolute; top: 0; left: 0; right: 0; height: 32px;
  display: flex; align-items: center; padding: 0 var(--space-3);
  background: color-mix(in srgb, var(--color-surface-2) 92%, transparent);
  backdrop-filter: blur(4px);
  border-bottom: 1px solid var(--color-border);
  font-size: var(--text-sm); font-weight: 600; gap: var(--space-2);
  opacity: 0; pointer-events: none; transition: opacity var(--duration-fast);
  z-index: 4;
}
.panel--hoverbar:hover .panel__hoverbar,
.panel--hoverbar .panel__hoverbar:hover { opacity: 1; pointer-events: auto; }
.panel__body { flex: 1; min-height: 0; overflow: auto; position: relative; }
.panel--p1 { flex: 1.4; }
.panel--p2 { flex: 1; }
.panel--p3 { flex: 1; }

/* 运行态面板内组件（无边框） */
.comp { display: flex; flex-direction: column; height: 100%; }
.comp__body { flex: 1; min-height: 0; overflow: auto; padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }

/* 消息气泡 */
.msg { display: flex; flex-direction: column; gap: 2px; max-width: 85%; }
.msg--user { align-self: flex-end; }
.msg--agent { align-self: flex-start; }
.msg__who { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 600; }
.msg__bubble { padding: var(--space-2) var(--space-3); border-radius: var(--radius-lg); font-size: var(--text-sm); line-height: 1.5; }
.msg--user .msg__bubble { background: var(--color-primary); color: var(--color-text-inverse); border-bottom-right-radius: 2px; }
.msg--agent .msg__bubble { background: var(--color-surface-2); border: 1px solid var(--color-border); border-bottom-left-radius: 2px; }
.msg__bubble pre { margin: var(--space-2) 0 0; background: var(--color-surface-3); padding: var(--space-2); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: var(--text-xs); overflow-x: auto; }

/* 输入行 */
.inputrow { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-top: 1px solid var(--color-border); background: var(--color-surface); }
.inputrow__field { flex: 1; padding: 6px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: inherit; font-size: var(--text-sm); background: var(--color-surface); color: var(--color-text); }
.inputrow__field:focus { outline: 2px solid var(--color-focus-ring); outline-offset: 1px; border-color: transparent; }
.select { padding: 6px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: inherit; font-size: var(--text-sm); background: var(--color-surface); color: var(--color-text); cursor: pointer; }

/* ===== 侧栏装配区 ===== */
.assembly { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--color-surface); border-right: 1px solid var(--color-border); }
.assembly__sec { padding: var(--space-2) var(--space-3); font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 600; }
.assembly__panel { padding: var(--space-2) var(--space-3); display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); cursor: pointer; border-radius: var(--radius-md); }
.assembly__panel:hover { background: var(--color-surface-2); }
.assembly__panel.active { background: var(--color-primary-soft); color: var(--color-primary); font-weight: 600; }
.assembly__panel.new { color: var(--color-primary); font-weight: 600; }
.assembly__list { flex: 1; overflow-y: auto; padding: 0 var(--space-2) var(--space-2); }
.assembly__item { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-1); font-size: var(--text-sm); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); cursor: grab; }
.assembly__item:hover { border-color: var(--color-primary); background: var(--color-primary-soft); }
.assembly__item:active { cursor: grabbing; }
.assembly__item.dragging { opacity: .5; border-style: dashed; }

/* ===== 空状态 ===== */
.empty-center { display: grid; place-items: center; height: 100%; text-align: center; }
.empty-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-6); max-width: 320px; box-shadow: var(--shadow-sm); }
.empty-card__icon { font-size: 40px; margin-bottom: var(--space-3); }
.empty-card__title { font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--space-2); }
.empty-card__desc { font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: var(--space-5); line-height: 1.6; }
.empty-card__actions { display: flex; gap: var(--space-2); justify-content: center; }

/* ===== 插件管理窗口 ===== */
.pluginwin { height: 100%; display: flex; flex-direction: column; background: var(--color-surface); }
.pluginwin__topbar { height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); border-bottom: 1px solid var(--color-border); }
.pluginwin__title { font-weight: 700; font-size: var(--text-md); }
.pluginwin__search { margin-left: var(--space-4); flex: 1; max-width: 260px; padding: 5px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--text-sm); }
.pluginwin__body { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
.pluginsec__title { font-size: var(--text-sm); font-weight: 700; color: var(--color-text-muted); margin-bottom: var(--space-2); display: flex; align-items: center; gap: var(--space-2); }
.plugincard { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: var(--space-2); background: var(--color-surface); }
.plugincard:hover { border-color: var(--color-primary); }
.plugincard__icon { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--color-surface-2); display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
.plugincard__info { flex: 1; min-width: 0; }
.plugincard__name { font-weight: 600; font-size: var(--text-sm); display: flex; align-items: center; gap: 6px; }
.plugincard__meta { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; }
.plugincard__status { display: flex; align-items: center; gap: 4px; font-size: var(--text-xs); color: var(--color-text-muted); }
.plugincard__actions { display: flex; gap: 6px; }
.plugin-detail { display: flex; flex-direction: column; gap: var(--space-3); }
.detail-card { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
.detail-card__head { padding: var(--space-2) var(--space-3); background: var(--color-surface-2); font-weight: 700; font-size: var(--text-sm); }
.detail-card__body { padding: var(--space-3); font-size: var(--text-sm); display: flex; flex-direction: column; gap: var(--space-2); }
.cap-row { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
.cap-row__name { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-primary); }
.cap-row__ok { margin-left: auto; color: var(--color-success); }
.switch { width: 34px; height: 18px; border-radius: var(--radius-full); background: var(--color-surface-3); position: relative; cursor: pointer; border: none; }
.switch.on { background: var(--color-primary); }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform var(--duration-fast); }
.switch.on::after { transform: translateX(16px); }
.danger-zone { border-color: var(--color-danger); border-radius: var(--radius-md); padding: var(--space-3); }
.danger-zone__title { color: var(--color-danger); font-weight: 700; font-size: var(--text-sm); margin-bottom: var(--space-2); }

/* ===== 弹窗 ===== */
.modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: var(--z-modal, 1100); }
.modal__backdrop { position: absolute; inset: 0; background: rgba(16,22,26,.4); }
.modal__card { position: relative; width: 480px; max-width: 90vw; max-height: 90vh; overflow-y: auto; background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.modal__head { padding: var(--space-4); border-bottom: 1px solid var(--color-border); display: flex; align-items: center; font-weight: 700; font-size: var(--text-md); }
.modal__close { margin-left: auto; }
.modal__body { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); font-size: var(--text-sm); }
.modal__foot { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-border); display: flex; justify-content: flex-end; gap: var(--space-2); }
.modal__field { display: flex; flex-direction: column; gap: var(--space-1); }
.modal__field label { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 600; }
.field { padding: 6px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: inherit; font-size: var(--text-sm); }
.radio-row { display: flex; align-items: center; gap: var(--space-2); padding: 6px 0; cursor: pointer; font-size: var(--text-sm); }
.radio-row input { accent-color: var(--color-primary); }
.radio-row__meta { margin-left: auto; font-size: var(--text-xs); color: var(--color-text-muted); }
.progress { height: 8px; border-radius: var(--radius-full); background: var(--color-surface-2); overflow: hidden; }
.progress__bar { height: 100%; background: var(--color-primary); border-radius: var(--radius-full); transition: width var(--duration-base); }
.install-step { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--color-text-muted); }
.install-step.done { color: var(--color-success); }
.install-step.active { color: var(--color-text); font-weight: 600; }
.install-step__ic { width: 18px; text-align: center; }

/* ===== 服务状态 ===== */
.svc-list { display: flex; flex-direction: column; gap: 2px; font-size: var(--text-sm); }
.svc-row { display: flex; align-items: center; gap: var(--space-2); padding: 4px 0; }
.svc-row__name { font-family: var(--font-mono); font-size: var(--text-xs); }
.svc-row__ver { color: var(--color-text-muted); font-size: var(--text-xs); }
.svc-row__state { margin-left: auto; font-size: var(--text-xs); color: var(--color-text-muted); }

/* ===== 加载 ===== */
.spinner { width: 28px; height: 28px; border: 3px solid var(--color-surface-3); border-top-color: var(--color-primary); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-center { display: grid; place-items: center; gap: var(--space-2); color: var(--color-text-muted); font-size: var(--text-sm); }
.error-comp { border: 1px dashed var(--color-danger); border-radius: var(--radius-md); padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); font-size: var(--text-sm); }

/* ===== Canvas 画布组件 ===== */
.canvas { position: relative; height: 100%; background: var(--color-surface-2); }
.canvas-comp { position: absolute; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; overflow: hidden; }
.canvas-comp__head { height: 26px; flex-shrink: 0; display: flex; align-items: center; padding: 0 var(--space-3); font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted); background: var(--color-surface-2); border-bottom: 1px solid var(--color-border); cursor: move; user-select: none; }
.canvas-comp__body { flex: 1; padding: var(--space-3); font-size: var(--text-sm); overflow: auto; }
.canvas-comp--idle { border-style: dashed; border-color: var(--color-border-strong); }
.canvas-comp--selected { border: 2px solid var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary-soft); }
.canvas-comp--drag { opacity: .5; border-style: dashed; }
.resize-handle { position: absolute; width: 8px; height: 8px; background: var(--color-primary); border: 1px solid #fff; border-radius: 2px; }
.resize-handle.se { right: -5px; bottom: -5px; cursor: nwse-resize; }
.resize-handle.ne { right: -5px; top: -5px; cursor: nesw-resize; }
.resize-handle.nw { left: -5px; top: -5px; cursor: nwse-resize; }
.resize-handle.sw { left: -5px; bottom: -5px; cursor: nesw-resize; }
.resize-handle.n { left: 50%; top: -5px; transform: translateX(-50%); cursor: ns-resize; }
.resize-handle.s { left: 50%; bottom: -5px; transform: translateX(-50%); cursor: ns-resize; }
.resize-handle.e { right: -5px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
.resize-handle.w { left: -5px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
.snap-line { position: absolute; background: var(--color-primary); opacity: .7; }
.snap-line.v { width: 1px; }
.snap-line.h { height: 1px; }
.ghost { position: absolute; border: 1px dashed var(--color-primary); background: var(--color-primary-soft); opacity: .5; border-radius: var(--radius-md); pointer-events: none; }

/* ===== 拖拽 Drop ===== */
.droppable { position: relative; }
.droppable.drop-hover { box-shadow: 0 0 0 2px var(--color-primary); }
.drop-preview { position: absolute; inset: 4px; border: 2px dashed var(--color-primary); border-radius: var(--radius-md); background: var(--color-primary-soft); opacity: .6; display: grid; place-items: center; color: var(--color-primary); font-size: var(--text-sm); pointer-events: none; z-index: 3; }

<script>
function toggleTheme() {
  const root = document.documentElement;
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeToggle').textContent = isDark ? '深色' : '浅色';
}
function show(id) {
  document.querySelectorAll('.demo-nav__item').forEach(b => b.classList.toggle('active', b.dataset.demo === id));
  const t = document.getElementById(id).dataset.title;
  document.getElementById('stageTitle').textContent = t;
  document.getElementById('stage').innerHTML = document.getElementById(id).innerHTML;
  // 清掉可能残留的交互状态
  document.querySelectorAll('.frame').forEach(f => f.classList.remove('frame--window','frame--wide','frame--modal'));
}
</script>
